name: Build Chrome extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish (optional)
        type: string
        required: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Chrome extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}
          fetch-depth: ${{ (github.ref_type == 'tag' || inputs.release_tag) && '0' || '1' }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Verify release tag
        if: env.RELEASE_TAG != ''
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          git merge-base --is-ancestor HEAD origin/main

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run compile

      - name: Run regression tests
        run: npm test

      - name: Build Chrome ZIP
        run: npm run zip -- --browser chrome

      - name: Check bundle boundaries
        run: node --test tests/bundle-check.mjs

      - name: Prepare download
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          built_at=$(TZ=Europe/Moscow date '+%Y-%m-%d_%H-%M-%S-MSK')
          filename="confluence-tools-ci-chrome-${version}-${built_at}.zip"
          mkdir -p .output/artifact
          cp ".output/confluence-ext-${version}-chrome.zip" ".output/artifact/${filename}"
          echo "path=.output/artifact/${filename}" >> "$GITHUB_OUTPUT"

      - name: Upload Chrome ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 90

      - name: Stage release ZIP
        if: env.RELEASE_TAG != ''
        run: |
          version=${RELEASE_TAG#v}
          mkdir -p .output/release
          cp ".output/confluence-ext-${version}-chrome.zip" ".output/release/confluence-tools-ci-chrome-${version}.zip"

      - name: Transfer release ZIP to publishing job
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: .output/release/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish versioned Chrome ZIP to GitHub Releases
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tested Chrome ZIP
        uses: actions/download-artifact@v8
        with:
          name: release-package
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${RELEASE_TAG#v}
          filename="confluence-tools-ci-chrome-${version}.zip"
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes "release/${filename}"
