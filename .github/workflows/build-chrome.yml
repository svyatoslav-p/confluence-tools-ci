name: Build Chrome extension

on:
  push:
    branches: [main]
    paths-ignore: [update.json]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Chrome extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      built_at: ${{ steps.stamp.outputs.built_at }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run compile

      - name: Run regression tests
        run: npm test

      - name: Set build timestamp
        id: stamp
        run: |
          built_at=$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')
          echo "CT_BUILD_TIMESTAMP=${built_at}" >> "$GITHUB_ENV"
          echo "built_at=${built_at}" >> "$GITHUB_OUTPUT"

      - name: Build Chrome ZIP
        run: npm run zip -- --browser chrome

      - name: Check bundle boundaries
        run: node --test tests/bundle-check.mjs

      - name: Prepare download
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          built_at=$(TZ=Europe/Moscow date '+%Y-%m-%d_%H-%M-%S-MSK')
          filename="confluence-tools-ci-chrome-${version}-${built_at}.zip"
          mkdir -p .output/artifact
          cp ".output/confluence-ext-${version}-chrome.zip" ".output/artifact/${filename}"
          echo "path=.output/artifact/${filename}" >> "$GITHUB_OUTPUT"

      - name: Upload Chrome ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 90

  publish-update:
    name: Publish update metadata
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate update.json
        env:
          CT_BUILD_TIMESTAMP: ${{ needs.build.outputs.built_at }}
        run: node scripts/write-update.mjs
      - name: Publish metadata to main
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Newer commits exist in main; skipping outdated metadata."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: publish build metadata [skip ci]"
          git push origin HEAD:main
